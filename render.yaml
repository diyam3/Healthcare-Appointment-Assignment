services:
  - type: web
    name: healthcare-appointment-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema ./prisma/schema.prisma
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: SLOT_HOLD_MINUTES
        value: 8
      - key: REMINDER_HOURS_BEFORE
        value: 24
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
